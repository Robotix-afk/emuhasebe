<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f766e" />
  <title>YANMUHASEBE Mobil</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#f0f3f6; --card:#fff; --text:#0f172a; --muted:#64748b;
      --primary:#0f766e; --primary-2:#0d9488; --danger:#dc2626; --ok:#16a34a;
      --border:#e2e8f0; --shadow:0 8px 24px rgba(15,23,42,.08);
      --nav-h:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px); --radius:16px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none}
    body{padding-top:var(--safe-t)}
    button,input,select,textarea{font:inherit}
    input,select,textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:14px;background:#fff;font-size:16px}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
    .hidden{display:none!important}
    #auth-screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px calc(24px + var(--safe-b));background:linear-gradient(165deg,#0f766e 0%,#134e4a 45%,#0f172a 100%);color:#fff}
    .auth-logo{text-align:center;margin-bottom:28px}
    .auth-logo .mark{width:64px;height:64px;margin:0 auto 12px;border-radius:18px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}
    .auth-logo h1{margin:0;font-size:22px;font-weight:800}
    .auth-logo p{margin:6px 0 0;opacity:.8;font-size:13px}
    .auth-card{background:#fff;color:var(--text);border-radius:20px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
    .auth-card label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.04em}
    .auth-actions{margin-top:16px;display:flex;flex-direction:column;gap:10px}
    .btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-ghost{background:#f1f5f9;color:var(--text)}
    .btn-danger{background:#fef2f2;color:var(--danger)}
    .btn-block{width:100%}
    .auth-switch{text-align:center;margin-top:14px;font-size:13px;color:var(--muted)}
    .auth-switch a{color:var(--primary);font-weight:700;text-decoration:none}
    .auth-err{color:var(--danger);font-size:13px;margin-top:8px;display:none}
    #app-screen{display:none;min-height:100vh;min-height:100dvh;flex-direction:column}
    #app-screen.on{display:flex}
    .topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .topbar h2{margin:0;font-size:18px;font-weight:800}
    .topbar .sub{font-size:11px;color:var(--muted);font-weight:600}
    .icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:#f1f5f9;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(var(--nav-h) + var(--safe-b) + 16px)}
    .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;align-items:stretch;justify-content:space-around}
    .nav-tab{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;cursor:pointer;padding:6px 2px}
    .nav-tab svg{width:22px;height:22px}
    .nav-tab.active{color:var(--primary)}
    .hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .stat{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
    .stat .lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
    .stat .val{font-size:18px;font-weight:800;margin-top:4px}
    .stat.wide{grid-column:1/-1;background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff}
    .stat.wide .lbl{color:rgba(255,255,255,.85)}
    .section-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 10px}
    .list-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px}
    .row-item{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #f1f5f9;cursor:pointer;background:#fff}
    .row-item:last-child{border-bottom:0}
    .row-item:active{background:#f8fafc}
    .row-item .avatar{width:42px;height:42px;border-radius:12px;background:#ecfdf5;color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
    .row-item .meta{flex:1;min-width:0}
    .row-item .meta strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row-item .meta span{font-size:12px;color:var(--muted)}
    .row-item .right{text-align:right;flex-shrink:0}
    .row-item .right strong{font-size:14px;display:block}
    .row-item .right span{font-size:11px;color:var(--muted)}
    .empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:14px}
    .search-bar{display:flex;gap:8px;margin-bottom:12px}
    .search-bar input{flex:1;border-radius:14px}
    .fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:28px;font-weight:300;box-shadow:0 12px 28px rgba(15,118,110,.4);z-index:45;cursor:pointer;line-height:1}
    .sheet-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:none;align-items:flex-end;justify-content:center}
    .sheet-backdrop.show{display:flex}
    .sheet{width:100%;max-width:520px;max-height:92vh;background:#fff;border-radius:20px 20px 0 0;padding:12px 16px calc(16px + var(--safe-b));overflow-y:auto;animation:slideUp .28s ease}
    @keyframes slideUp{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
    .sheet-handle{width:40px;height:4px;background:#cbd5e1;border-radius:4px;margin:4px auto 12px}
    .sheet h3{margin:0 0 12px;font-size:18px;font-weight:800}
    .form-group{margin-bottom:12px}
    .form-group label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
    .sheet-actions{display:flex;gap:10px;margin-top:8px}
    .sheet-actions .btn{flex:1}
    .warn-banner{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;margin-bottom:12px}
    .toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 20px);transform:translateX(-50%) translateY(20px);opacity:0;background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:100;transition:.25s;pointer-events:none;max-width:90%}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
    .chip{flex-shrink:0;border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--muted)}
    .chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}

    .home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 16px}
    .home-tile{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px 8px;text-align:center;cursor:pointer;box-shadow:var(--shadow)}

    .home-tile .ico{width:48px;height:48px;margin:0 auto 8px;border-radius:50%;background:#ecfdf5;color:var(--primary);display:flex;align-items:center;justify-content:center}.home-tile .ico svg{display:block}.acc-row .ico{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0}.acc-row.danger .ico{color:var(--danger)}.acc-row .ico svg{width:18px;height:18px}.row-item .avatar svg{width:20px;height:20px}.avatar.ico-soft{background:#ecfdf5;color:var(--primary)}.avatar.ico-red{background:#fef2f2;color:#dc2626}.avatar.ico-blue{background:#eff6ff;color:#2563eb}.avatar.ico-green{background:#ecfdf5;color:#16a34a}

    .brand-bar{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
    .brand-bar h3{margin:0;font-size:18px;font-weight:800}
    .brand-bar p{margin:4px 0 0;font-size:12px;opacity:.9}
    .acc-banner{background:#dc2626;color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px}
    .acc-banner strong{display:block;font-size:14px}
    .acc-banner span{font-size:12px;opacity:.95}
    .acc-row{display:flex;align-items:center;gap:12px;padding:16px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-weight:700;color:var(--primary);font-size:14px}
    .acc-row:active{background:#f8fafc}
    .acc-row .ico{width:28px;text-align:center;font-size:16px}
    .acc-row.danger{color:var(--danger)}

  </style>
</head>

  var currentUser=null, data=null, currentPage='home', _sb=null;

  function formatMoney(n){return (Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₺'}

  function storageKey(){return 'ym_mobile_data_'+(currentUser&&(currentUser.username||currentUser.id)||'guest')}

  async function cloudSave(){var client=getSb();if(!client||!currentUser||!currentUser.username)return;try{await client.from('user_data').upsert({username:currentUser.username,data:data,updated_at:new Date().toISOString()},{onConflict:'username'})}catch(e){console.warn(e)}}

  async function fetchUserByUsername(username){var client=getSb();if(!client)return null;var res=await client.from('app_users').select('*').eq('username',username).maybeSingle();return res.data||null}
  function showRegister(on){document.getElementById('login-card').classList.toggle('hidden',!!on);document.getElementById('register-card').classList.toggle('hidden',!on)}
  function showErr(id,msg){var el=document.getElementById(id);el.style.display=msg?'block':'none';el.textContent=msg||''}

  async function doLogin(){
    var user=(document.getElementById('login-user').value||'').trim();
    var pass=document.getElementById('login-pass').value||'';
    showErr('login-err','');
    if(!user||!pass)return showErr('login-err','Kullanıcı adı ve şifre gerekli');
    try{
      var client=getSb();if(!client)return showErr('login-err','Bağlantı yok');
      var key=user.toLowerCase(),row=null;
      var byUser=await client.from('app_users').select('*').eq('username',key).maybeSingle();
      if(byUser.data)row=byUser.data;
      if(!row&&user.indexOf('@')>=0){var byMail=await client.from('app_users').select('*').eq('email',key).maybeSingle();if(byMail.data)row=byMail.data}
      if(!row&&/^\d{5}$/.test(user)){var byNo=await client.from('app_users').select('*').eq('musteri_no',user).maybeSingle();if(byNo.data)row=byNo.data}
      if(!row)return showErr('login-err','Kullanıcı bulunamadı');
      if(row.aktif===false||row.kapali===true||row.disabled===true)return showErr('login-err','Hesap kapalı');
      if(String(row.password||'')!==String(simpleHash(pass)))return showErr('login-err','Şifre hatalı');
      currentUser={id:row.id,username:row.username,name:row.name||row.username,email:row.email||'',musteriNo:row.musteri_no||'',trialEndDate:row.trial_end||null,subscriptionEnd:row.subscription_end||null,aktif:row.aktif!==false};
      try{localStorage.setItem('ym_mobile_session',JSON.stringify(currentUser))}catch(e){}
      await enterApp();
    }catch(e){showErr('login-err',e.message||'Giriş hatası')}
  }

  async function doRegister(){
    var name=(document.getElementById('reg-name').value||'').trim();
    var user=(document.getElementById('reg-user').value||'').trim().toLowerCase();
    var email=(document.getElementById('reg-email').value||'').trim().toLowerCase();
    var pass=document.getElementById('reg-pass').value||'';
    showErr('reg-err','');
    if(!user||user.length<3)return showErr('reg-err','Kullanıcı adı en az 3 karakter');
    if(!pass||pass.length<4)return showErr('reg-err','Şifre en az 4 karakter');
    if(!email)email=null;
    var client=getSb();if(!client)return showErr('reg-err','Bağlantı yok');
    try{
      if(await fetchUserByUsername(user))return showErr('reg-err','Bu kullanıcı adı alınmış');
      if(email){var em=await client.from('app_users').select('id,username').eq('email',email).maybeSingle();if(em.data)return showErr('reg-err','Bu e-posta zaten kayıtlı. Giriş yapın.')}
      var trialEnd=new Date(Date.now()+TRIAL_DAYS*86400000).toISOString();
      var res=await client.from('app_users').insert({
        username:user,email:email,name:name||user,password:simpleHash(pass),musteri_no:generateMusteriNo(),
        aktif:true,disabled:false,kapali:false,subscription_status:'trial',subscription_plan:null,
        subscription_start:null,subscription_end:null,trial_end:trialEnd
      }).select().maybeSingle();
      if(res.error)throw new Error(mapUniqueError(res.error.message));
      document.getElementById('login-user').value=user;
      document.getElementById('login-pass').value=pass;
      showRegister(false);toast('Kayıt tamam');await doLogin();
    }catch(e){showErr('reg-err',mapUniqueError(e.message||'Kayıt hatası'))}
  }

  function subWarningHtml(){
    if(!currentUser)return '';
    var end=currentUser.subscriptionEnd||currentUser.trialEndDate;if(!end)return '';
    var days=Math.ceil((new Date(end)-new Date())/86400000);
    if(days>3)return '';
    if(days<0)return '<div class="warn-banner">Abonelik / deneme bitti. Web’den uzatın.</div>';
    return '<div class="warn-banner">Aboneliğiniz '+days+' gün sonra bitiyor.</div>';
  }

  function goPage(page){
    currentPage=page;
    var mainTabs=['home','urunler','cariler','satis','more'];
    document.querySelectorAll('.nav-tab').forEach(function(t){
      t.classList.toggle('active',t.getAttribute('data-tab')===page||(page==='more'&&t.getAttribute('data-tab')==='more'&&mainTabs.indexOf(page)<0));
    });
    if(mainTabs.indexOf(page)>=0){
      document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.toggle('active',t.getAttribute('data-tab')===page)});
    } else {
      document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.toggle('active',t.getAttribute('data-tab')==='more')});
    }

  function renderUrunler(){

  function saveSatis(){
    var urunId=parseInt((document.getElementById('f-urun')||{}).value,10);
    var miktar=parseFloat((document.getElementById('f-miktar')||{}).value)||0;
    var fiyat=parseFloat((document.getElementById('f-fiyat')||{}).value)||0;
    if(!urunId||miktar<=0)return toast('Ürün ve miktar seçin');
    var urun=(data.urunler||[]).find(function(u){return u.id===urunId});
    if(!urun)return toast('Ürün bulunamadı');
    if((urun.stok||0)<miktar){if(!confirm('Stok yetersiz ('+(urun.stok||0)+'). Yine de devam?'))return;}
    var tutar=Math.round(miktar*fiyat*100)/100;
    var cariId=parseInt(document.getElementById('f-cari').value,10)||null;
    var cari=cariId?data.cariler.find(function(c){return c.id===cariId}):null;
    var hesapId=parseInt(document.getElementById('f-hesap').value,10)||null;
    var hesap=(data.hesaplar||[]).find(function(h){return h.id===hesapId});
    data.faturalar.push({
      id:nextId('fatura'),tip:'satis',tarih:document.getElementById('f-tarih').value,

  async function claimQrLogin(){
    var raw=((document.getElementById('f-qr-token')||{}).value||'').trim();
    if(!raw)return toast('Token girin');
    var token=raw;
    if(token.indexOf('YANLOGIN:')===0)token=token.slice(9);
    token=token.trim();
    if(!token)return toast('Geçersiz kod');
    try{
      var client=getSb();
      if(!client)return toast('Bağlantı yok');
      var res=await client.from('qr_sessions').update({
        status:'claimed',
        username:currentUser.username,
        claimed_at:new Date().toISOString()
      }).eq('token',token).eq('status','pending').select().maybeSingle();
      if(res.error)throw new Error(res.error.message);
      if(!res.data){
        // upsert fallback: maybe row missing
        var ins=await client.from('qr_sessions').upsert({
          token:token,status:'claimed',username:currentUser.username,
          claimed_at:new Date().toISOString(),
          created_at:new Date().toISOString(),
          expires_at:new Date(Date.now()+3*60*1000).toISOString()
        },{onConflict:'token'}).select().maybeSingle();
        if(ins.error)throw new Error(ins.error.message);
      }
      closeSheet();
      toast('Bilgisayar bağlandı — web sayfasını kontrol edin');
    }catch(e){
      toast(e.message||String(e));
    }
  }
