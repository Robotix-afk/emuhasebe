<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f766e" />
  <title>YANMUHASEBE Mobil</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg:#f0f3f6; --card:#fff; --text:#0f172a; --muted:#64748b;
      --primary:#0f766e; --primary-2:#0d9488; --danger:#dc2626; --ok:#16a34a;
      --border:#e2e8f0; --shadow:0 8px 24px rgba(15,23,42,.08);
      --nav-h:64px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px); --radius:16px;
    }
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;padding:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);overscroll-behavior:none}
    body{padding-top:var(--safe-t)}
    button,input,select,textarea{font:inherit}
    input,select,textarea{width:100%;border:1px solid var(--border);border-radius:12px;padding:14px;background:#fff;font-size:16px}
    input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(15,118,110,.15)}
    .hidden{display:none!important}
    #auth-screen{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:24px 20px calc(24px + var(--safe-b));background:linear-gradient(165deg,#0f766e 0%,#134e4a 45%,#0f172a 100%);color:#fff}
    .auth-logo{text-align:center;margin-bottom:28px}
    .auth-logo .mark{width:64px;height:64px;margin:0 auto 12px;border-radius:18px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px}
    .auth-logo h1{margin:0;font-size:22px;font-weight:800}
    .auth-logo p{margin:6px 0 0;opacity:.8;font-size:13px}
    .auth-card{background:#fff;color:var(--text);border-radius:20px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
    .auth-card label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 6px;text-transform:uppercase;letter-spacing:.04em}
    .auth-actions{margin-top:16px;display:flex;flex-direction:column;gap:10px}
    .btn{border:0;border-radius:14px;padding:14px 16px;font-weight:700;font-size:15px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
    .btn-primary{background:var(--primary);color:#fff}
    .btn-ghost{background:#f1f5f9;color:var(--text)}
    .btn-danger{background:#fef2f2;color:var(--danger)}
    .btn-block{width:100%}
    .auth-switch{text-align:center;margin-top:14px;font-size:13px;color:var(--muted)}
    .auth-switch a{color:var(--primary);font-weight:700;text-decoration:none}
    .auth-err{color:var(--danger);font-size:13px;margin-top:8px;display:none}
    #app-screen{display:none;min-height:100vh;min-height:100dvh;flex-direction:column}
    #app-screen.on{display:flex}
    .topbar{position:sticky;top:0;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px}
    .topbar h2{margin:0;font-size:18px;font-weight:800}
    .topbar .sub{font-size:11px;color:var(--muted);font-weight:600}
    .icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:#f1f5f9;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 14px calc(var(--nav-h) + var(--safe-b) + 16px)}
    .bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);background:rgba(255,255,255,.96);backdrop-filter:blur(16px);border-top:1px solid var(--border);display:flex;align-items:stretch;justify-content:space-around}
    .nav-tab{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:700;cursor:pointer;padding:6px 2px}
    .nav-tab svg{width:22px;height:22px}
    .nav-tab.active{color:var(--primary)}
    .hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
    .stat{background:var(--card);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow)}
    .stat .lbl{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase}
    .stat .val{font-size:18px;font-weight:800;margin-top:4px}
    .stat.wide{grid-column:1/-1;background:linear-gradient(135deg,#0f766e,#0d9488);color:#fff}
    .stat.wide .lbl{color:rgba(255,255,255,.85)}
    .section-title{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:8px 0 10px}
    .list-card{background:var(--card);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px}
    .row-item{display:flex;align-items:center;gap:12px;padding:14px;border-bottom:1px solid #f1f5f9;cursor:pointer;background:#fff}
    .row-item:last-child{border-bottom:0}
    .row-item:active{background:#f8fafc}
    .row-item .avatar{width:42px;height:42px;border-radius:12px;background:#ecfdf5;color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
    .row-item .meta{flex:1;min-width:0}
    .row-item .meta strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .row-item .meta span{font-size:12px;color:var(--muted)}
    .row-item .right{text-align:right;flex-shrink:0}
    .row-item .right strong{font-size:14px;display:block}
    .row-item .right span{font-size:11px;color:var(--muted)}
    .empty{text-align:center;padding:36px 16px;color:var(--muted);font-size:14px}
    .search-bar{display:flex;gap:8px;margin-bottom:12px}
    .search-bar input{flex:1;border-radius:14px}
    .fab{position:fixed;right:16px;bottom:calc(var(--nav-h) + var(--safe-b) + 16px);width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--primary),var(--primary-2));color:#fff;font-size:28px;font-weight:300;box-shadow:0 12px 28px rgba(15,118,110,.4);z-index:45;cursor:pointer;line-height:1}
    .sheet-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:80;display:none;align-items:flex-end;justify-content:center}
    .sheet-backdrop.show{display:flex}
    .sheet{width:100%;max-width:520px;max-height:92vh;background:#fff;border-radius:20px 20px 0 0;padding:12px 16px calc(16px + var(--safe-b));overflow-y:auto;animation:slideUp .28s ease}
    @keyframes slideUp{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
    .sheet-handle{width:40px;height:4px;background:#cbd5e1;border-radius:4px;margin:4px auto 12px}
    .sheet h3{margin:0 0 12px;font-size:18px;font-weight:800}
    .form-group{margin-bottom:12px}
    .form-group label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:6px}
    .sheet-actions{display:flex;gap:10px;margin-top:8px}
    .sheet-actions .btn{flex:1}
    .warn-banner{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:12px;padding:12px 14px;font-size:13px;font-weight:600;margin-bottom:12px}
    .toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + var(--safe-b) + 20px);transform:translateX(-50%) translateY(20px);opacity:0;background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;font-size:13px;font-weight:600;z-index:100;transition:.25s;pointer-events:none;max-width:90%}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    
    
    
    
    .rapor-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
    .rapor-tile{border-radius:12px;padding:18px 14px;color:#fff;min-height:100px;display:flex;flex-direction:column;justify-content:space-between}
    .rapor-tile .num{font-size:26px;font-weight:800;letter-spacing:-.02em}
    .rapor-tile .lbl{font-size:13px;font-weight:600;opacity:.95;margin-top:8px}
    .rapor-tile.orange{background:#f59e0b}
    .rapor-tile.red{background:#ef4444}
    .rapor-tile.blue{background:#3b82f6}
    .rapor-tile.green{background:#22c55e}

    .hesap-sec{background:#f1f5f9;padding:10px 16px;font-size:11px;font-weight:800;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin:0 -14px}
    .hesap-row{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-bottom:1px solid #f1f5f9;cursor:pointer;background:#fff}
    .hesap-row:active{background:#f8fafc}
    .hesap-row .ad{font-size:15px;font-weight:700;color:var(--primary)}
    .hesap-row .bakiye{font-size:14px;font-weight:700;color:#0f172a}

    .satis-chips{display:flex;gap:8px;overflow-x:auto;padding:0 0 12px;-webkit-overflow-scrolling:touch;margin:0 -2px}
    .satis-chip{flex-shrink:0;border:0;border-radius:8px;padding:10px 12px;font-size:11px;font-weight:800;letter-spacing:.02em;cursor:pointer;color:#fff}
    .satis-chip.sip{background:#ef4444}
    .satis-chip.irs{background:#3b82f6}
    .satis-chip.fat{background:#22c55e}
    .satis-chip.donem{background:#fff;color:#ef4444;border:1px solid #e2e8f0}
    .satis-chip.off{opacity:.45}
    .satis-card{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:var(--shadow);border:1px solid var(--border)}
    .satis-card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px}
    .satis-card .date{font-size:14px;font-weight:700;color:#0f172a}
    .satis-card .amt{font-size:15px;font-weight:800;color:#0f172a}
    .satis-card .name{font-size:13px;font-weight:800;color:#64748b;letter-spacing:.04em;text-transform:uppercase}
    .satis-card .desc{font-size:13px;color:#94a3b8;margin-top:2px}
    .satis-card .no{font-size:12px;color:#94a3b8;margin-top:2px}
    .satis-badge{display:inline-block;margin-top:12px;padding:6px 14px;border-radius:999px;background:#f1f5f9;color:#ef4444;font-size:12px;font-weight:700}
    .satis-badge.ok{color:#16a34a;background:#ecfdf5}
    .satis-badge.draft{color:#64748b}

    .urun-card{background:#fff;border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);border:1px solid var(--border);display:flex;align-items:center;gap:12px;cursor:pointer}
    .urun-card:active{background:#f8fafc}
    .urun-card .thumb{width:52px;height:52px;border-radius:50%;object-fit:cover;background:#f1f5f9;flex-shrink:0}
    .urun-card .thumb-ph{width:52px;height:52px;border-radius:50%;background:#ecfdf5;color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0}
    .urun-card .meta{flex:1;min-width:0}
    .urun-card .meta strong{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .urun-card .qty{font-size:13px;color:var(--muted);font-weight:700;flex-shrink:0}
    .urun-hero{position:relative;margin:-12px -14px 0;height:220px;background:#1e293b;overflow:hidden}
    .urun-hero img{width:100%;height:100%;object-fit:cover;display:block}
    .urun-hero .ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-size:48px}
    .urun-hero .fab-cam{position:absolute;bottom:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(0,0,0,.3);cursor:pointer}
    .urun-hero .fab-back{position:absolute;bottom:12px;left:12px;width:44px;height:44px;border-radius:50%;border:0;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
    .urun-title{padding:16px 4px 8px}
    .urun-title h2{margin:0;font-size:20px;font-weight:800;color:var(--primary)}
    .kar-badge{display:inline-block;background:#f59e0b;color:#fff;border-radius:999px;padding:4px 12px;font-size:12px;font-weight:800;margin-top:8px}
    .stok-block{padding:12px 4px 16px;text-align:center}
    .stok-block .n{font-size:22px;font-weight:800}
    .stok-block .l{font-size:12px;color:var(--muted);margin-top:2px}

    .cari-banner{background:linear-gradient(160deg,#1e293b 0%,#0f172a 100%);color:#fff;border-radius:0 0 20px 20px;margin:-12px -14px 0;padding:28px 20px 24px;text-align:center;position:relative}
    .cari-banner h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
    .cari-banner .sub{margin-top:6px;font-size:13px;opacity:.75}
    .cari-stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:16px 4px 8px;text-align:center}
    .cari-stats .st .val{font-size:18px;font-weight:800}
    .cari-stats .st .val.neg{color:#dc2626}
    .cari-stats .st .val.pos{color:#16a34a}
    .cari-stats .st .lbl{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.25}
    .cari-menu-row{display:flex;align-items:center;gap:14px;padding:16px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer;background:#fff;font-weight:800;font-size:14px;color:var(--primary);letter-spacing:.02em}
    .cari-menu-row:active{background:#f8fafc}
    .cari-menu-row .ico{width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:#64748b}
    .cari-menu-row .ico svg{width:22px;height:22px}
    .cari-menu-row .chev{margin-left:auto;color:#cbd5e1}
    .act-row{display:flex;align-items:center;gap:12px;padding:16px 8px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-weight:800;font-size:14px}
    .act-row:active{background:#f8fafc}
    .act-row.red{color:#dc2626}
    .act-row.teal{color:#0f766e}
    .act-row .ico{width:26px;display:flex;align-items:center;justify-content:center}
    .act-row .ico svg{width:20px;height:20px}
    .act-close{text-align:center;padding:16px;font-weight:800;color:#dc2626;cursor:pointer}

.m-ai-chat{display:flex;flex-direction:column;gap:10px;min-height:40vh;max-height:55vh;overflow-y:auto;padding:8px 0 12px;-webkit-overflow-scrolling:touch}
.m-ai-msg{max-width:88%;padding:12px 14px;border-radius:16px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}
.m-ai-msg.bot{background:#fff;border:1px solid var(--border);align-self:flex-start;box-shadow:var(--shadow)}
.m-ai-msg.user{background:var(--primary);color:#fff;align-self:flex-end}
.m-ai-msg img{max-width:100%;border-radius:10px;margin-bottom:6px;display:block}
.m-ai-input{display:flex;gap:8px;align-items:center;position:sticky;bottom:0;background:var(--bg);padding:8px 0;flex-wrap:wrap}
.m-ai-input input[type=text]{flex:1;min-width:120px}
.m-ai-chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;-webkit-overflow-scrolling:touch}
.m-ai-chips button{flex-shrink:0;border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;font-weight:700;color:var(--muted)}
    .chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;-webkit-overflow-scrolling:touch}
    .chip{flex-shrink:0;border:1px solid var(--border);background:#fff;border-radius:999px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--muted)}
    .chip.on{background:var(--primary);color:#fff;border-color:var(--primary)}

    .home-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:8px 0 16px}
    .home-tile{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px 8px;text-align:center;cursor:pointer;box-shadow:var(--shadow)}
    .home-tile:active{transform:scale(.97);background:#f8fafc}
    .home-tile .ico{width:48px;height:48px;margin:0 auto 8px;border-radius:50%;background:#ecfdf5;color:var(--primary);display:flex;align-items:center;justify-content:center}.home-tile .ico svg{display:block}.acc-row .ico{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--primary);flex-shrink:0}.acc-row.danger .ico{color:var(--danger)}.acc-row .ico svg{width:18px;height:18px}.row-item .avatar svg{width:20px;height:20px}.avatar.ico-soft{background:#ecfdf5;color:var(--primary)}.avatar.ico-red{background:#fef2f2;color:#dc2626}.avatar.ico-blue{background:#eff6ff;color:#2563eb}.avatar.ico-green{background:#ecfdf5;color:#16a34a}
    .home-tile .lbl{font-size:11px;font-weight:800;color:var(--text);line-height:1.2;text-transform:uppercase;letter-spacing:.02em}
    .brand-bar{background:linear-gradient(135deg,#0f766e,#134e4a);color:#fff;border-radius:16px;padding:16px;margin-bottom:14px}
    .brand-bar h3{margin:0;font-size:18px;font-weight:800}
    .brand-bar p{margin:4px 0 0;font-size:12px;opacity:.9}
    .acc-banner{background:#dc2626;color:#fff;border-radius:12px;padding:12px 14px;margin-bottom:12px}
    .acc-banner strong{display:block;font-size:14px}
    .acc-banner span{font-size:12px;opacity:.95}
    .acc-row{display:flex;align-items:center;gap:12px;padding:16px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer;font-weight:700;color:var(--primary);font-size:14px}
    .acc-row:active{background:#f8fafc}
    .acc-row .ico{width:28px;text-align:center;font-size:16px}
    .acc-row.danger{color:var(--danger)}

  </style>
</head>
<body>
  <div id="auth-screen">
    <div class="auth-logo"><div class="mark">YM</div><h1>YAN MUHASEBE</h1><p>Muhasebe işinizi kolaylaştırın</p></div>
    <div class="auth-card" id="login-card">
      <label>Kullanıcı adı / e-posta</label>
      <input id="login-user" autocomplete="username" placeholder="kullanıcı veya e-posta">
      <label>Şifre</label>
      <input id="login-pass" type="password" autocomplete="current-password" placeholder="••••••">
      <p class="auth-err" id="login-err"></p>
      <div class="auth-actions"><button type="button" class="btn btn-primary btn-block" onclick="doLogin()">Giriş Yap</button></div>
      <div class="auth-switch">Hesabın yok mu? <a href="#" onclick="showRegister(true);return false;">Kayıt ol</a></div>
    </div>
    <div class="auth-card hidden" id="register-card">
      <label>Ad Soyad</label><input id="reg-name" placeholder="Ad Soyad">
      <label>Kullanıcı adı</label><input id="reg-user" autocomplete="username" placeholder="kullanıcı adı">
      <label>E-posta</label><input id="reg-email" type="email" placeholder="ornek@mail.com">
      <label>Şifre</label><input id="reg-pass" type="password" placeholder="en az 4 karakter">
      <p class="auth-err" id="reg-err"></p>
      <div class="auth-actions">
        <button type="button" class="btn btn-primary btn-block" onclick="doRegister()">Kayıt Ol</button>
        <button type="button" class="btn btn-ghost btn-block" onclick="showRegister(false)">Geri</button>
      </div>
    </div>
  </div>

  <div id="app-screen">
    <div class="topbar">
      <div><h2 id="top-title">Özet</h2><div class="sub" id="top-sub">—</div></div>
      <button type="button" class="icon-btn" onclick="goPage('more')" aria-label="Menü">
        <svg width="20" height="20" fill="none" stroke="#0f172a" stroke-width="2"><circle cx="10" cy="5" r="1.2"/><circle cx="10" cy="10" r="1.2"/><circle cx="10" cy="15" r="1.2"/></svg>
      </button>
    </div>
    <div class="content" id="page-content"></div>
    <button type="button" class="fab hidden" id="main-fab" onclick="onFab()">+</button>
    <nav class="bottom-nav">
      <button type="button" class="nav-tab active" data-tab="home" onclick="goPage('home')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a2 2 0 01-2 2h-4v-6H9v6H5a2 2 0 01-2-2z"/></svg>Özet
      </button>
      <button type="button" class="nav-tab" data-tab="urunler" onclick="goPage('urunler')">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10"/></svg>Ürün
      </button>
      <button type="button" class="nav-tab" data-tab="cariler" onclick="goPage('cariler')">

  function setSatisFilter(tip){

      var cur=satisFilter.donem;
      var ix=opts.indexOf(cur);
      satisFilter.donem=opts[(ix+1)%opts.length];

    }

  function renderSatis(){
    var q=(searchQ.satis||'').toLowerCase();
    var list=(data.faturalar||[]).slice();
    // dönem filtresi
    var days=satisFilter.donem||0;
    if(days>0){
      var cut=Date.now()-days*86400000;
      list=list.filter(function(f){ return new Date(f.tarih||0).getTime()>=cut; });
    }
    // tip: siparis / irsaliye / fatura — kayıtta tip veya durum
    var tip=satisFilter.tip||'fatura';
    list=list.filter(function(f){
      var t=(f.belgeTip||f.tip||'fatura').toLowerCase();
      if(tip==='siparis') return t.indexOf('siparis')>=0||t==='siparis';
      if(tip==='irsaliye') return t.indexOf('irsaliye')>=0||t==='irsaliye';
      // fatura: varsayılan satışlar (sipariş/irsaliye değil)
      return t.indexOf('siparis')<0 && t.indexOf('irsaliye')<0;
    });
    list=list.slice().reverse();
    if(q){
      list=list.filter(function(f){
        return [f.cariAd,f.musteri,f.urunAd,f.aciklama,f.no,String(f.id)].join(' ').toLowerCase().indexOf(q)>=0;
      });
    }
    var donemLbl={30:'SON 1 AY',90:'SON 3 AY',180:'SON 6 AY',365:'SON 1 YIL',0:'TÜMÜ'}[satisFilter.donem]||'SON 3 AY';
    var html='<div class="search-bar"><input placeholder="satış arama" value="'+escAttr(searchQ.satis)+'" oninput="searchQ.satis=this.value;goPage(\'satis\')"></div>';
    html+='<div class="satis-chips">';
    html+='<button type="button" class="satis-chip sip'+(tip==='siparis'?'':' off')+'" onclick="setSatisFilter(\'siparis\')">SİPARİŞLER</button>';
    html+='<button type="button" class="satis-chip irs'+(tip==='irsaliye'?'':' off')+'" onclick="setSatisFilter(\'irsaliye\')">İRSALİYELER</button>';
    html+='<button type="button" class="satis-chip fat'+(tip==='fatura'?'':' off')+'" onclick="setSatisFilter(\'fatura\')">FATURALAR</button>';
    html+='<button type="button" class="satis-chip donem" onclick="setSatisFilter(\'donem\')">'+donemLbl+' ▾</button>';
    html+='</div>';
    if(!list.length) return html+'<div class="empty">Kayıt yok. + ile satış ekleyin.</div>';
    list.forEach(function(f){
      var no = f.no || f.faturaNo || String(f.id).padStart(3,'0');
      var durum = f.durum || f.status || 'Faturalaşmış';
      var badgeCls = /taslak|bekle/i.test(durum) ? 'draft' : (/iptal|iade/i.test(durum) ? '' : 'ok');
      if(/faturala/i.test(durum)) badgeCls = '';
      html+='<div class="satis-card" onclick="openSatisDetail('+f.id+')">';
      html+='<div class="top"><span class="date">'+formatDate(f.tarih)+'</span><span class="amt">'+formatMoney(f.toplam||f.genelToplam||0).replace(' ₺',' TL')+'</span></div>';
      html+='<div class="name">'+esc((f.cariAd||f.musteri||'Perakende')).toUpperCase()+'</div>';
      html+='<div class="desc">'+esc(f.urunAd||f.aciklama||'Satış')+'</div>';
      html+='<div class="no">'+esc(no)+'</div>';
      html+='<span class="satis-badge '+badgeCls+'">'+esc(durum)+'</span>';
      html+='</div>';
    });
    return html;
  }

  function renderRaporlar(){
    var now=new Date();
    var y=now.getFullYear(), m=now.getMonth();
    var ayAdlari=['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
    var ayAd=ayAdlari[m];
    var bugun=now.toISOString().slice(0,10);
    var ciro=0, masraf=0, tahsilat=0, alacak=0;
    (data.faturalar||[]).forEach(function(f){
      var t=new Date(f.tarih||0);
      if(t.getFullYear()===y && t.getMonth()===m) ciro+=Number(f.toplam||f.genelToplam||0);
    });
    (data.giderler||[]).forEach(function(g){
      var t=new Date(g.tarih||0);
      if(t.getFullYear()===y && t.getMonth()===m) masraf+=Number(g.tutar||0);
    });
    (data.hareketler||[]).forEach(function(h){
      if(h.tip==='giris' && (h.tarih||'').slice(0,10)===bugun) tahsilat+=Number(h.tutar||0);
    });
    (data.cariler||[]).forEach(function(c){
      if(c.tip==='tedarikci') return;
      var b=Number(c.bakiye)||0;
      if(b>0) alacak+=b;
    });
    function n(v){ return (Number(v)||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
    var html='<div class="rapor-grid">';
    html+='<div class="rapor-tile orange"><div class="num">'+n(ciro)+'</div><div class="lbl">'+ayAd+' Cirosu</div></div>';
    html+='<div class="rapor-tile red"><div class="num">'+n(masraf)+'</div><div class="lbl">'+ayAd+' Masrafları</div></div>';
    html+='<div class="rapor-tile blue"><div class="num">'+n(tahsilat)+'</div><div class="lbl">Bugünkü Tahsilat</div></div>';
    html+='<div class="rapor-tile green"><div class="num">'+n(alacak)+'</div><div class="lbl">Açık Alacaklar</div></div>';
    html+='</div>';
    html+='<div class="list-card" style="overflow:hidden">';
    html+='<div class="cari-menu-row" onclick="goPage(\'satis\')"><span class="ico">'+(YM_ICONS.cart||'')+'</span>SATIŞLAR<span class="chev">›</span></div>';
    html+='<div class="cari-menu-row" onclick="goPage(\'alislar\')"><span class="ico">'+(YM_ICONS.warehouse||YM_ICONS.box||'')+'</span>ALIŞLAR<span class="chev">›</span></div>';
    html+='<div class="cari-menu-row" onclick="goPage(\'giderler\')"><span class="ico">'+(YM_ICONS.cash||'')+'</span>MASRAFLAR<span class="chev">›</span></div>';
    html+='<div class="cari-menu-row" onclick="showRaporIadeler()"><span class="ico">'+(YM_ICONS.transfer||'')+'</span>İADELER<span class="chev">›</span></div>';
    html+='<div class="cari-menu-row" onclick="goPage(\'kasa\')"><span class="ico">'+(YM_ICONS.wallet||'')+'</span>KASA-HESAP HAREKETLERİ<span class="chev">›</span></div>';
    html+='<div class="cari-menu-row" onclick="showBorcAlacak()"><span class="ico">'+(YM_ICONS.users||'')+'</span>BORÇ ALACAK LİSTESİ<span class="chev">›</span></div>';
    html+='</div>';
    return html;

  function yanAiIsOffTopic(q) {
    var t = String(q || '').toLowerCase();
    // iş / program / muhasebe dışı konular
    var off = /oyun|dizi|film|futbol|maç|şarkı|müzik|flört|aşk|sevgili|cinsel|porn|bahis|kumar|siyaset|seçim|parti oy|din |namaz|oruç|astroloji|burç|fal |şifre kır|hack|illegal|uyuşturucu|silah yap/;
    if (off.test(t)) return true;
    return false;
  }
  function yanAiReply(question, hasImage) {
    var text = String(question || '').toLowerCase().trim();
    if (yanAiIsOffTopic(text) && !hasImage) {
      return 'Buna yardım edemem. Ben YAN MUHASEBE asistanıyım; muhasebe, işletme ve program kullanımı konularında yardımcı olurum.';
    }
    if (yanAiIsOffTopic(text) && hasImage) {
      return 'Buna yardım edemem. İş veya programla ilgili bir belge/fiş/ürün fotoğrafı gönderirsen yardımcı olabilirim.';
    }
    if (!data) data = (typeof emptyData === 'function' ? emptyData() : { cariler: [], urunler: [], faturalar: [], giderler: [], hareketler: [] });
    function format(n) {
      try { return (typeof formatMoney === 'function') ? formatMoney(n) : ((Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2}) + ' ₺'); }
      catch (e) { return String(n); }
    }
    var kasa = 0;
    (data.hareketler || []).forEach(function(h) {
      kasa += h.tip === 'giris' || h.tip === 'Giriş' ? (Number(h.tutar) || 0) : -(Number(h.tutar) || 0);
    });
    var alacak = 0, borc = 0, musteriSay = 0, tedarikSay = 0;
    (data.cariler || []).forEach(function(c) {
      var b = Number(c.bakiye) || 0;
      if (c.tip === 'tedarikci') { tedarikSay++; if (b < 0) borc += Math.abs(b); else if (b > 0) borc += b; }
      else { musteriSay++; if (b > 0) alacak += b; else if (b < 0) alacak += Math.abs(b); }
    });
    var now = new Date(), ay = now.getMonth(), yil = now.getFullYear(), buAyGider = 0, buAySatis = 0;
    (data.giderler || []).forEach(function(g) {
      var d = new Date(g.tarih || 0);
      if (d.getMonth() === ay && d.getFullYear() === yil) buAyGider += Number(g.tutar) || 0;
    });
    (data.faturalar || []).forEach(function(f) {
      var d = new Date(f.tarih || 0);
      if (d.getMonth() === ay && d.getFullYear() === yil) buAySatis += Number(f.toplam || f.genelToplam) || 0;
    });
    var toplamSatis = 0;
    (data.faturalar || []).forEach(function(f) { toplamSatis += Number(f.toplam || f.genelToplam) || 0; });
    var urunSay = (data.urunler || []).length;
    var dusukStok = (data.urunler || []).filter(function(u) { return (u.stok || 0) <= (u.minStok || 0) && (u.minStok || 0) > 0; });
    if (!dusukStok.length) dusukStok = (data.urunler || []).filter(function(u) { return (u.stok || 0) <= 0; }).slice(0, 8);

    if (hasImage) {
      if (/fiş|fatura|makbuz|gider|masraf|receipt|invoice/.test(text) || !text) {
        return 'Fotoğraf alındı.\nFiş/fatura görüntüsü için: tutarı, tarihi ve açıklamayı yazarsan Masraf veya Satış kaydına yönlendirebilirim.\nÖrnek: «Bu fiş 450 TL market masrafı, bugün»';
      }
      if (/ürün|barkod|stok|etiket/.test(text)) {
        return 'Ürün fotoğrafı alındı.\nÜrün adını, satış fiyatını ve stok adedini yaz; Ürünler menüsünden kart açmanı önerebilirim.';
      }
      return 'Fotoğraf alındı. İş veya programla ilgili ne sormak istediğini yaz (fiş, ürün, stok, cari…). Alakasız konularda yardımcı olamam.';
    }

    if (/kasa|nakit|param ne|ne kadar.*var/.test(text)) return 'Kasa / nakit hareket neti: ' + format(kasa);
    if (/alacak/.test(text)) return 'Toplam alacak (müşteri bakiyeleri): ' + format(alacak) + '\nMüşteri sayısı: ' + musteriSay;
    if (/borç|borc/.test(text)) return 'Toplam borç / tedarikçi: ' + format(borc) + '\nTedarikçi sayısı: ' + tedarikSay;
    if (/gider|masraf/.test(text)) return 'Bu ay masraflar: ' + format(buAyGider) + '\nToplam masraf kaydı: ' + (data.giderler || []).length;
    if (/satış|satis|ciro|fatura/.test(text)) return 'Bu ay satış: ' + format(buAySatis) + '\nToplam satış: ' + format(toplamSatis) + '\nFatura/satış adedi: ' + (data.faturalar || []).length;
    if (/stok|ürün|urun/.test(text)) {
      var list = (data.urunler || []).slice(0, 12).map(function(u) { return '• ' + u.ad + ' — stok ' + (u.stok || 0) + ' · ' + format(u.fiyat || 0); });
      var extra = dusukStok.length ? ('\n\nDikkat (düşük/sıfır stok):\n' + dusukStok.slice(0, 6).map(function(u){ return '• ' + u.ad + ' (' + (u.stok||0) + ')'; }).join('\n')) : '';
      return 'Ürün sayısı: ' + urunSay + (list.length ? '\n\n' + list.join('\n') : '\nHenüz ürün yok.') + extra;
    }
    if (/cari|müşteri|musteri|tedarik/.test(text)) return 'Müşteri: ' + musteriSay + '\nTedarikçi: ' + tedarikSay + '\nAlacak: ' + format(alacak) + '\nBorç: ' + format(borc);
    if (/özet|genel|durum|rapor/.test(text)) {
      return '—— YAN AI Özet ——\nKasa: ' + format(kasa) + '\nAlacak: ' + format(alacak) + '\nBorç: ' + format(borc) +
        '\nBu ay satış: ' + format(buAySatis) + '\nBu ay masraf: ' + format(buAyGider) +
        '\nÜrün: ' + urunSay + ' · Müşteri/Tedarikçi: ' + musteriSay + '/' + tedarikSay;
    }
    if (/nasıl|nasil|kullan|öğret|ogret|menü|menu|satış gir|urun ekle/.test(text)) {
      return 'Hızlı kullanım:\n• Satış: Satışlar → + → ürün seç\n• Alış: Alışlar → + → ürün seç\n• Masraf: Masraflar → hesap seç\n• Ürün/Cari: ilgili menüden ekle\n• Mobil ve web aynı Supabase hesabını kullanır.';
    }
    if (/abonelik|üyelik|uyelik|deneme|fiyat|ödeme|odeme/.test(text)) {
      return 'Abonelik ve deneme süresi hesap ayarlarından / web üyelik bölümünden yönetilir. Süre bitince web panelden uzatılır.';
    }
    if (/merhaba|selam|hey|günaydın|iyi günler/.test(text)) {
      return 'Merhaba! Ben Yan AI. Muhasebe verilerin ve program hakkında sorabilirsin; fiş/ürün fotoğrafı da gönderebilirsin. İş dışı konularda yardımcı olamam.';
    }
    if (/kimsin|ne yapıyorsun|yardım|help/.test(text)) {
      return 'Yan AI — YAN MUHASEBE asistanı.\n• Kasa, cari, stok, satış, masraf\n• Program kullanımı\n• Fiş/ürün fotoğrafı (iş ile ilgili)\nİş veya program dışı konularda: «Buna yardım edemem.»';
    }
    // alakasız gibi görünen ama işe bağlanabilecek genel sorular
    if (text.length > 2) {
      return 'Sorunu muhasebe veya program bağlamında yanıtlayayım:\n' +
        'Veri özeti — Kasa: ' + format(kasa) + ', Alacak: ' + format(alacak) + ', Bu ay satış: ' + format(buAySatis) + '.\n' +
        'Daha net sor (ör. «kasada ne var», «stok listesi», «bu ay masraf»).\n' +
        'Konu iş/program dışıysa yardımcı olamam.';
    }
    return 'Bir şey yaz veya fotoğraf ekle. İş ve program konularında yardımcı olurum.';
  }

  function mAiAppend(role, text, img){
    var chat = document.getElementById('m-ai-chat');
    if (!chat) return;
    var div = document.createElement('div');
    div.className = 'm-ai-msg ' + (role === 'user' ? 'user' : 'bot');
    var h = '';
    if (img) h += '<img src="' + img + '" alt=""/>';
    h += String(text || '').replace(/</g,'&lt;');
    div.innerHTML = h;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }
  function mAiPhoto(input){
    var f = input && input.files && input.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function(){
      _mAiPhoto = r.result;
      var p = document.getElementById('m-ai-prev');
      if (p) { p.style.display = 'block'; p.textContent = 'Fotoğraf seçildi'; }
    };
    r.readAsDataURL(f);
  }
  function mAiSend(){
    var input = document.getElementById('m-ai-input');
    var q = (input && input.value || '').trim();
    var has = !!_mAiPhoto;
    if (!q && !has) return;
    mAiAppend('user', q || '(fotoğraf)', _mAiPhoto);
    if (input) input.value = '';
    var img = _mAiPhoto;
    _mAiPhoto = null;
    var p = document.getElementById('m-ai-prev');
    if (p) { p.style.display = 'none'; p.textContent = ''; }
    var fi = document.getElementById('m-ai-file');
    if (fi) fi.value = '';
    setTimeout(function(){ mAiAppend('bot', yanAiReply(q, has)); }, 180);
  }
  function mAiAsk(q){
    var input = document.getElementById('m-ai-input');
    if (input) input.value = q;
    mAiSend();
  }

  function onUrunPhotoFile(input, id){
    var file = input && input.files && input.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var dataUrl = reader.result;
      // compress
      var img = new Image();
      img.onload = function(){
        var max = 800;
        var w = img.width, h = img.height;
        if(w > max || h > max){
          if(w > h){ h = Math.round(h * max / w); w = max; }
          else { w = Math.round(w * max / h); h = max; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        var out = canvas.toDataURL('image/jpeg', 0.72);
        var u = (data.urunler || []).find(function(x){ return x.id === id; });
        if(u){ u.resim = out; saveLocal(); goPage('urun-detail'); toast('Fotoğraf kaydedildi'); }
      };
      img.src = dataUrl;
    };
    reader.readAsDataURL(file);
  }

  function previewUrunFormPhoto(input){
    var file = input && input.files && input.files[0];
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var img = new Image();
      img.onload = function(){
        var max = 800, w = img.width, h = img.height;
        if(w > max || h > max){
          if(w > h){ h = Math.round(h * max / w); w = max; }
          else { w = Math.round(w * max / h); h = max; }
        }
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        var out = canvas.toDataURL('image/jpeg', 0.72);
        var hid = document.getElementById('f-resim-data');
        if(hid) hid.value = out;
        var prev = document.getElementById('f-resim-prev');
        if(prev){ prev.style.display = 'block'; prev.innerHTML = '<img src="'+out+'" style="max-width:120px;border-radius:12px">'; }
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  }

  function saveIade(){
    var urunId = parseInt((document.getElementById('f-urun') || {}).value, 10);
    var miktar = parseFloat((document.getElementById('f-miktar') || {}).value) || 0;
    var fiyat = parseFloat((document.getElementById('f-fiyat') || {}).value) || 0;
    if(!urunId || miktar <= 0) return toast('Ürün ve miktar seçin');
    var urun = (data.urunler || []).find(function(u){ return u.id === urunId; });
    if(!urun) return toast('Ürün yok');
    if((urun.stok || 0) < miktar){ if(!confirm('Stok yetersiz. Devam?')) return; }
    var tutar = Math.round(miktar * fiyat * 100) / 100;
    var cariId = parseInt(document.getElementById('f-cari-id').value, 10);
    var c = data.cariler.find(function(x){ return x.id === cariId; });
    var hesapId = parseInt(document.getElementById('f-hesap').value, 10) || null;
    var hesap = (data.hesaplar || []).find(function(h){ return h.id === hesapId; });
    if(!Array.isArray(data.alislar)) data.alislar = [];
    data.alislar.push({
      id: nextId('alis'), tip: 'iade', tarih: document.getElementById('f-tarih').value,
      tedarikciId: cariId, tedarikciAd: c ? c.ad : '',
      urunId: urunId, urunAd: urun.ad, miktar: miktar, birimFiyat: fiyat,
      toplam: -tutar, tutar: -tutar, hesapId: hesapId, hesapAd: hesap ? hesap.ad : '',
      aciklama: (document.getElementById('f-aciklama').value || '').trim() || ('İade: ' + urun.ad)
    });
    urun.stok = (Number(urun.stok) || 0) - miktar;
    if(c) c.bakiye = (Number(c.bakiye) || 0) + tutar; // iade: tedarikçi borcu azalır
    if(hesapId){
      data.hareketler.push({
        id: nextId('hareket'), tip: 'giris', tutar: tutar, hesapId: hesapId, hesapAd: hesap ? hesap.ad : '',
        cariId: cariId, aciklama: 'İade tahsilat: ' + urun.ad, tarih: document.getElementById('f-tarih').value
      });
    }
    saveLocal(); closeSheet();
    currentCariId = cariId;
    goPage('cari-detail');
    toast('İade kaydedildi');
  }

  function ensureHesaplar(){
    if(!data)data=emptyData();
    if(!Array.isArray(data.hesaplar))data.hesaplar=[];
    if(!data.nextId)data.nextId={};
    if(typeof data.nextId.hesap!=='number')data.nextId.hesap=1;
    if(data.hesaplar.length)return;
    var defs=[
      {tip:'kasa',ad:'TL Kasa',para:'TL'},
      {tip:'banka',ad:'Banka TL Hesabı',para:'TL'},
      {tip:'banka',ad:'Banka USD Hesabı',para:'USD'},
      {tip:'banka',ad:'Banka EUR Hesabı',para:'EUR'},
      {tip:'pos',ad:'POS Hesabı',para:'TL'},
      {tip:'kredi',ad:'Kredi Kartım',para:'TL'},
      {tip:'ortak',ad:'Şirket Ortağı Hesabı',para:'TL'},
      {tip:'veresiye',ad:'Veresiye Hesabı',para:'TL'}
    ];
    defs.forEach(function(h){
      data.hesaplar.push({id:data.nextId.hesap++,tip:h.tip,ad:h.ad,para:h.para,bakiye:0});
    });
  }
  function hesapBakiye(h){
    var bal=Number(h.bakiye)||0;
    // hareketlerden hesapla (varsa)
    var sum=0, has=false;
    (data.hareketler||[]).forEach(function(x){
      if(x.hesapId===h.id){
        has=true;
        sum += x.tip==='giris' ? (Number(x.tutar)||0) : -(Number(x.tutar)||0);
      }
    });
    return has ? sum : bal;
  }
  function formatHesapPara(n, para){
    para=para||'TL';
    var s=(Number(n)||0).toLocaleString('tr-TR',{minimumFractionDigits:2,maximumFractionDigits:2});
    return s+' '+para;
  }
  function renderHesaplar(){
    ensureHesaplar();
    var groups=[
      {key:'kasa', title:'KASA HESAPLARI'},
      {key:'banka', title:'BANKA HESAPLARI'},
      {key:'pos', title:'POS HESAPLARI'},
      {key:'kredi', title:'KREDİ KARTLARI'},
      {key:'ortak', title:'ORTAKLAR'},
      {key:'veresiye', title:'VERESİYE HESAPLARI'}
    ];
    var html='';
    groups.forEach(function(g){
      var items=(data.hesaplar||[]).filter(function(h){ return (h.tip||'kasa')===g.key; });
      if(!items.length && g.key!=='kasa' && g.key!=='banka') return;
      html+='<div class="hesap-sec">'+g.title+'</div>';
      if(!items.length){
        html+='<div class="hesap-row" style="color:#94a3b8;font-size:13px">Hesap yok</div>';
        return;
      }
      items.forEach(function(h){
        var bal=hesapBakiye(h);
        html+='<div class="hesap-row" onclick="openHesapForm('+h.id+')"><span class="ad">'+esc(h.ad)+'</span><span class="bakiye">'+formatHesapPara(bal,h.para)+'</span></div>';
      });
    });
    // diğer tipler
    var known=['kasa','banka','pos','kredi','ortak','veresiye'];
    var other=(data.hesaplar||[]).filter(function(h){ return known.indexOf(h.tip)<0; });
    if(other.length){
      html+='<div class="hesap-sec">DİĞER</div>';
      other.forEach(function(h){
        html+='<div class="hesap-row" onclick="openHesapForm('+h.id+')"><span class="ad">'+esc(h.ad)+'</span><span class="bakiye">'+formatHesapPara(hesapBakiye(h),h.para)+'</span></div>';
      });
    }
    return html||'<div class="empty">Hesap yok</div>';
  }

  function saveSatis(){
    var urunId=parseInt((document.getElementById('f-urun')||{}).value,10);
    var miktar=parseFloat((document.getElementById('f-miktar')||{}).value)||0;
    var fiyat=parseFloat((document.getElementById('f-fiyat')||{}).value)||0;
    if(!urunId||miktar<=0)return toast('Ürün ve miktar seçin');
    var urun=(data.urunler||[]).find(function(u){return u.id===urunId});
    if(!urun)return toast('Ürün bulunamadı');
    if((urun.stok||0)<miktar){if(!confirm('Stok yetersiz ('+(urun.stok||0)+'). Yine de devam?'))return;}
    var tutar=Math.round(miktar*fiyat*100)/100;
    var cariId=parseInt(document.getElementById('f-cari').value,10)||null;
    var cari=cariId?data.cariler.find(function(c){return c.id===cariId}):null;
    var hesapId=parseInt(document.getElementById('f-hesap').value,10)||null;
    var hesap=(data.hesaplar||[]).find(function(h){return h.id===hesapId});
    data.faturalar.push({
      id:nextId('fatura'),tip:'satis',tarih:document.getElementById('f-tarih').value,
      cariId:cariId,cariAd:cari?cari.ad:'Perakende',
      urunId:urunId,urunAd:urun.ad,miktar:miktar,birimFiyat:fiyat,
      toplam:tutar,genelToplam:tutar,hesapId:hesapId,hesapAd:hesap?hesap.ad:'',
      aciklama:(document.getElementById('f-aciklama').value||'').trim()||('Satış: '+urun.ad)
    });
    urun.stok=(Number(urun.stok)||0)-miktar;
    if(cari)cari.bakiye=(Number(cari.bakiye)||0)+tutar;
    if(hesapId){
      data.hareketler.push({id:nextId('hareket'),tip:'giris',tutar:tutar,hesapId:hesapId,aciklama:'Satış tahsilat: '+urun.ad,tarih:document.getElementById('f-tarih').value});
    }
    saveLocal();closeSheet();goPage('satis');toast('Satış kaydedildi');
  }

  var _qrStream=null,_qrScanTimer=null;
  function stopQrCamera(){
    if(_qrScanTimer){clearInterval(_qrScanTimer);_qrScanTimer=null}
    if(_qrStream){_qrStream.getTracks().forEach(function(t){t.stop()});_qrStream=null}
    var v=document.getElementById('qr-video');if(v){v.style.display='none';v.srcObject=null}
  }
  async function startQrCamera(){
    var st=document.getElementById('qr-cam-status');
    try{
      stopQrCamera();
      if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
        if(st)st.textContent='Bu cihazda kamera yok — tokenı elle yapıştırın.';
        return;
      }
      var stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
      _qrStream=stream;
      var v=document.getElementById('qr-video');
      if(!v)return;
      v.style.display='block';v.srcObject=stream;await v.play();
      if(st)st.textContent='Kamerayı QR koda tutun…';
      // BarcodeDetector API (Chrome/Android)
      if(window.BarcodeDetector){
        var det=new BarcodeDetector({formats:['qr_code']});
        _qrScanTimer=setInterval(async function(){
          try{
            var codes=await det.detect(v);
            if(codes&&codes[0]&&codes[0].rawValue){
              var val=codes[0].rawValue;
              var inp=document.getElementById('f-qr-token');
              if(inp)inp.value=val;
              stopQrCamera();
              if(st)st.textContent='Okundu, bağlanıyor…';
              claimQrLogin();
            }
          }catch(e){}
        },500);
      } else {
        if(st)st.textContent='Otomatik okuma desteklenmiyor. QR altındaki tokenı kopyalayıp yapıştırın.';
      }
    }catch(e){
      if(st)st.textContent='Kamera açılamadı: '+(e.message||e)+' — tokenı elle girin.';
    }
  }
  async function claimQrLogin(){
    var raw=((document.getElementById('f-qr-token')||{}).value||'').trim();
    if(!raw)return toast('Token girin veya kamerayla okutun');
    var token=raw;
    // YANLOGIN:xxx veya sadece token
    var m=token.match(/YANLOGIN:([a-fA-F0-9]+)/);
    if(m)token=m[1];
    else if(token.indexOf('YANLOGIN:')===0)token=token.slice(9).trim();
    token=token.replace(/\s+/g,'').trim();
    if(token.length<8)return toast('Geçersiz kod');
    try{
      var client=getSb();
      if(!client)return toast('Supabase bağlantısı yok');
      // Önce satırı oku
      var check=await client.from('qr_sessions').select('*').eq('token',token).maybeSingle();
      if(check.error){
        throw new Error('Tablo hatası: '+check.error.message+' — Supabase\'de qr_sessions.sql çalıştırın.');
      }
      if(!check.data){
        // Web henüz yazmadıysa yine de claimed upsert dene (web poll yakalar)
        var ins=await client.from('qr_sessions').upsert({
          token:token,
          status:'claimed',
          username:currentUser.username,
          claimed_at:new Date().toISOString(),
          created_at:new Date().toISOString(),
          expires_at:new Date(Date.now()+5*60*1000).toISOString()
        },{onConflict:'token'}).select().maybeSingle();
        if(ins.error)throw new Error(ins.error.message);
      } else {
        if(check.data.status==='used')return toast('Bu kod zaten kullanılmış. Web\'de yeni QR açın.');
        var upd=await client.from('qr_sessions').update({
          status:'claimed',
          username:currentUser.username,
          claimed_at:new Date().toISOString()
        }).eq('token',token).select().maybeSingle();
        if(upd.error)throw new Error(upd.error.message);
        if(!upd.data){
          // RLS bazen update döndürmez — upsert dene
          var up2=await client.from('qr_sessions').upsert({
            token:token,
            status:'claimed',
            username:currentUser.username,
            claimed_at:new Date().toISOString(),
            created_at:check.data.created_at||new Date().toISOString(),
            expires_at:check.data.expires_at||new Date(Date.now()+5*60*1000).toISOString()
          },{onConflict:'token'}).select().maybeSingle();
          if(up2.error)throw new Error(up2.error.message);
        }
      }
      stopQrCamera();
      closeSheet();
      toast('Bağlandı! Bilgisayardaki sayfayı kontrol edin.');
    }catch(e){
      var msg=e.message||String(e);
      if(/relation|does not exist|qr_sessions/i.test(msg))
        msg='qr_sessions tablosu yok. Supabase SQL Editor\'da qr_sessions.sql dosyasını çalıştırın.';
      toast(msg);
    }
  }
